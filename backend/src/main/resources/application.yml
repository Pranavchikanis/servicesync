spring:
  datasource:
    url: jdbc:mysql://localhost:3306/servicesync
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50

jwt:
  secret: ${JWT_SECRET}
  expirationMs: 86400000 # 24 hours


sla:
  service:
    url: ${SLA_SERVICE_URL:http://localhost:8081}
