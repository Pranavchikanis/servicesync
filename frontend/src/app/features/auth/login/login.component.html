<div class="d-flex align-items-center py-4 bg-light" style="height: 100vh;">
    <main class="form-signin w-100 m-auto" style="max-width: 400px; padding: 15px;">
        <div class="card shadow-sm border-0 fade-in">
            <div class="card-body p-4 p-md-5">
                <h2 class="text-center mb-4 fw-bold" style="color: var(--primary-color);">ServiceSync</h2>
                
                <div *ngIf="error" class="alert alert-danger" role="alert">
                    {{ error }}
                </div>

                <form (ngSubmit)="onSubmit($event)">
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="email" [(ngModel)]="email" name="email" placeholder="name@example.com" required>
                        <label for="email">Email address</label>
                    </div>
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="password" [(ngModel)]="password" name="password" placeholder="Password" required>
                        <label for="password">Password</label>
                    </div>

                    <button class="w-100 btn btn-lg btn-primary mb-3" type="submit">Sign in</button>
                </form>
                
                <div class="text-center mt-3">
                    <a routerLink="/track" class="text-decoration-none text-muted">Customer? Track your repair here</a>
                </div>
            </div>
        </div>
    </main>
</div>
